name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate content
        run: python scripts/validate_content.py --lenient
      - name: Lint, unit tests, debug build
        run: ./gradlew --no-daemon ktlintCheck lintDebug testDebugUnitTest assembleDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
